<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" role="img">
<title>迷你条双来源对照原型</title>
<desc>360x104 迷你条内聚合两个来源，每个来源一行，展示最吃紧指标，告警来源整行左侧红条</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- 卡片（放大示意，标注实际尺寸） -->
<rect x="40" y="26" width="400" height="172" rx="14" fill="#ffffff" stroke="#e3e8ec" stroke-width="0.5"/>
<text x="60" y="46" font-family="system-ui" font-size="13" font-weight="500" fill="#16313f">额度卡片</text>
<text x="60" y="60" font-family="system-ui" font-size="10" fill="#4d6570">实际 360 × 104</text>

<!-- chips -->
<rect x="306" y="36" width="56" height="24" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="334" y="52" font-family="system-ui" font-size="11" fill="#0C447C" text-anchor="middle">Codex</text>
<rect x="368" y="36" width="66" height="24" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="401" y="52" font-family="system-ui" font-size="11" fill="#0F6E56" text-anchor="middle">WorkBuddy</text>

<!-- 行1 Codex -->
<rect x="56" y="78" width="4" height="44" rx="2" fill="#a32d2d"/>
<rect x="68" y="84" width="24" height="24" rx="6" fill="#85B7EB"/>
<text x="80" y="100" font-family="system-ui" font-size="12" font-weight="500" fill="#042C53" text-anchor="middle">C</text>
<text x="100" y="98" font-family="system-ui" font-size="13" font-weight="500" fill="#16313f">Codex</text>
<text x="100" y="114" font-family="system-ui" font-size="11" fill="#a32d2d">周额度告急 · 9%</text>
<rect x="230" y="92" width="150" height="8" rx="4" fill="#eef2f4"/>
<rect x="230" y="92" width="13" height="8" rx="4" fill="#E24B4A"/>
<text x="392" y="99" font-family="system-ui" font-size="12" fill="#16313f" text-anchor="end">1.9h</text>

<!-- 行2 WorkBuddy -->
<rect x="68" y="134" width="24" height="24" rx="6" fill="#AFA9EC"/>
<text x="80" y="150" font-family="system-ui" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">W</text>
<text x="100" y="148" font-family="system-ui" font-size="13" font-weight="500" fill="#16313f">WorkBuddy</text>
<text x="100" y="164" font-family="system-ui" font-size="11" fill="#4d6570">积分 · 剩余 25%</text>
<rect x="230" y="148" width="150" height="8" rx="4" fill="#eef2f4"/>
<rect x="230" y="148" width="37" height="8" rx="4" fill="#1D9E75"/>
<text x="392" y="155" font-family="system-ui" font-size="12" fill="#16313f" text-anchor="end">12,480</text>

<!-- 说明 -->
<text x="40" y="218" font-family="system-ui" font-size="11" fill="#4d6570">规则：每来源只显示最吃紧的一条指标；Codex 取剩余比例最低的窗口，WorkBuddy 取积分剩余比例；告警来源整行左侧红条</text>
</svg>
